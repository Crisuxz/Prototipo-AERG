# Proxy inverso del prototipo AERG (ver docs/deployment.md).
# Alternativa a Caddy; aqui el certificado TLS se gestiona aparte (certbot).

server {
    listen 80;
    server_name tu-dominio.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tu-dominio.example;

    ssl_certificate     /etc/letsencrypt/live/tu-dominio.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.example/privkey.pem;

    # Debe ser coherente con MAX_UPLOAD_MB del backend.
    client_max_body_size 10m;

    # SPA compilada. El fallback a index.html es necesario porque el enrutado
    # lo hace react-router en el cliente.
    root /opt/aerg/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|docs|openapi.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La evaluacion es sincrona y espera a Gemini: el timeout debe superar
        # GEMINI_TIMEOUT_SECONDS con margen.
        proxy_read_timeout 90s;
    }
}
